<style>
  .ml-matrix { display: grid; gap: 14px; min-width: 0; }
  .ml-matrix .ml-matrix-group { display: grid; gap: 6px; min-width: 0; }
  .ml-matrix .ml-matrix-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; min-width: 0; }
  .ml-matrix .ml-matrix-cell { min-width: 0; }
  .ml-matrix input, .ml-matrix select { width: 100%; min-width: 0; box-sizing: border-box; }
  .ml-matrix .ml-matrix-results { display: grid; gap: 5px; overflow-wrap: anywhere; }
  .ml-matrix .ml-matrix-result-row { display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: space-between; }
  .ml-matrix .ml-matrix-error:empty { display: none; }
</style>
<div class="ml-matrix">
  <label class="form-label ml-matrix-group">
    变换预设
    <select class="form-select" data-matrix-preset>
      <option value="identity">恒等</option>
      <option value="rotation">旋转 45°（绕 z 轴）</option>
      <option value="shear" selected>剪切</option>
      <option value="scaling">缩放（x × 2，z × ½）</option>
      <option value="flatten">压扁（z → 0）</option>
      <option value="lineProjection">正交投影（直线 x = y，z = 0）</option>
      <option value="reflection">反射（x → −x）</option>
      <option value="custom">自定义</option>
    </select>
  </label>
  <div class="ml-matrix-group" role="group" aria-label="三行三列矩阵 A，按行排列">
    <span>矩阵 A</span>
    <div class="ml-matrix-grid">
      <label class="ml-matrix-cell"><span class="sr-only">A 第 1 行第 1 列</span><input class="form-control tabular-nums" data-matrix-entry="0" type="number" min="-3" max="3" step="any" value="1"></label>
      <label class="ml-matrix-cell"><span class="sr-only">A 第 1 行第 2 列</span><input class="form-control tabular-nums" data-matrix-entry="1" type="number" min="-3" max="3" step="any" value="0.6"></label>
      <label class="ml-matrix-cell"><span class="sr-only">A 第 1 行第 3 列</span><input class="form-control tabular-nums" data-matrix-entry="2" type="number" min="-3" max="3" step="any" value="0"></label>
      <label class="ml-matrix-cell"><span class="sr-only">A 第 2 行第 1 列</span><input class="form-control tabular-nums" data-matrix-entry="3" type="number" min="-3" max="3" step="any" value="0"></label>
      <label class="ml-matrix-cell"><span class="sr-only">A 第 2 行第 2 列</span><input class="form-control tabular-nums" data-matrix-entry="4" type="number" min="-3" max="3" step="any" value="1"></label>
      <label class="ml-matrix-cell"><span class="sr-only">A 第 2 行第 3 列</span><input class="form-control tabular-nums" data-matrix-entry="5" type="number" min="-3" max="3" step="any" value="0.3"></label>
      <label class="ml-matrix-cell"><span class="sr-only">A 第 3 行第 1 列</span><input class="form-control tabular-nums" data-matrix-entry="6" type="number" min="-3" max="3" step="any" value="0"></label>
      <label class="ml-matrix-cell"><span class="sr-only">A 第 3 行第 2 列</span><input class="form-control tabular-nums" data-matrix-entry="7" type="number" min="-3" max="3" step="any" value="0"></label>
      <label class="ml-matrix-cell"><span class="sr-only">A 第 3 行第 3 列</span><input class="form-control tabular-nums" data-matrix-entry="8" type="number" min="-3" max="3" step="any" value="1"></label>
    </div>
  </div>
  <div class="ml-matrix-group" role="group" aria-label="向量 v">
    <span>向量 v</span>
    <div class="ml-matrix-grid">
      <label class="form-label ml-matrix-cell">x<input class="form-control tabular-nums" data-matrix-vector="0" type="number" min="-3" max="3" step="any" value="1" aria-label="向量 v 的 x 分量"></label>
      <label class="form-label ml-matrix-cell">y<input class="form-control tabular-nums" data-matrix-vector="1" type="number" min="-3" max="3" step="any" value="1" aria-label="向量 v 的 y 分量"></label>
      <label class="form-label ml-matrix-cell">z<input class="form-control tabular-nums" data-matrix-vector="2" type="number" min="-3" max="3" step="any" value="1" aria-label="向量 v 的 z 分量"></label>
    </div>
  </div>
  <div class="ml-matrix-error text-small text-destructive" data-matrix-error role="alert"></div>
  <div class="text-small text-muted">每项可输入 −3 至 3；列向量决定三个基向量的去向。</div>
  <div class="ml-matrix-results tabular-nums" aria-live="polite" aria-atomic="true">
    <div class="ml-matrix-result-row"><span>Av</span><output data-matrix-product>(1.6, 1.3, 1)</output></div>
    <div class="ml-matrix-result-row"><span>det A</span><output data-matrix-det>1</output></div>
    <div class="ml-matrix-result-row"><span>体积倍率 |det A|</span><output data-matrix-volume>1</output></div>
    <div class="ml-matrix-result-row"><span>迹 tr A</span><output data-matrix-trace>3</output></div>
    <div class="ml-matrix-result-row"><span>数值秩 rank A</span><output data-matrix-rank>3 / 3</output></div>
    <div class="ml-matrix-result-row"><span>可逆性</span><output data-matrix-invertible>可逆（数值判断）</output></div>
    <div class="text-small text-muted" data-matrix-orientation>取向保持</div>
  </div>
  <div class="text-small text-muted" data-matrix-rank-note>秩按矩阵尺度归一化，以 10⁻¹² 为阈值估计；近奇异判断不代替精确证明。</div>
</div>
