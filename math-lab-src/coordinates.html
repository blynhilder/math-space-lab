<div class="ml-field">
  <div class="ml-field-head"><label class="form-label" for="ml-point-x">x 坐标</label><output id="ml-point-x-value" class="tabular-nums">1.00</output></div>
  <input class="form-range" id="ml-point-x" type="range" min="-2" max="2" value="1" step="0.05">
</div>
<div class="ml-field">
  <div class="ml-field-head"><label class="form-label" for="ml-point-y">y 坐标</label><output id="ml-point-y-value" class="tabular-nums">1.00</output></div>
  <input class="form-range" id="ml-point-y" type="range" min="-2" max="2" value="1" step="0.05">
</div>
<div class="ml-field">
  <div class="ml-field-head"><label class="form-label" for="ml-point-z">z 坐标</label><output id="ml-point-z-value" class="tabular-nums">1.00</output></div>
  <input class="form-range" id="ml-point-z" type="range" min="-2" max="2" value="1" step="0.05">
</div>
<label class="form-check"><input id="ml-projections" class="form-check-input" type="checkbox" checked><span class="form-check-label">显示坐标投影</span></label>
<div class="ml-readout tabular-nums" id="ml-point-readout" aria-live="polite"></div>
